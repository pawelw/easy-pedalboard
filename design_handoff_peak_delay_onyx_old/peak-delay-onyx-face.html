<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Peak Delay — onyx face (design reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1315;font-family:'Space Grotesk',sans-serif}
@keyframes tapfade{0%{opacity:.95}100%{opacity:.08}}
</style></head><body>
<!-- ============ 1c  onyx ============ -->
<div style="width:568px;box-sizing:border-box;padding:22px 26px 24px;border-radius:20px;background:#171d20;border:1px solid #2a3336;box-shadow:0 20px 44px rgba(0,0,0,.4)">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:20px">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="./peak-logo.png" alt="" style="height:22px;width:auto;display:block;filter:brightness(0) invert(84%) sepia(9%) saturate(360%) hue-rotate(150deg)">
      <h1 style="margin:0;font:700 19px/1 'Space Grotesk',sans-serif;color:#b9d3d9">Peak Delay</h1>
    </div>
    <span style="font:500 9px/1 'Space Grotesk',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8ba3a9">Stereo · 1/8 · 1/8T</span>
  </header>

  <!-- echo scope -->
  <div style="height:78px;border-radius:12px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);position:relative;overflow:hidden;margin-bottom:22px">
    <div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#233034"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 20px">
      <div style="flex:1;display:flex;justify-content:space-between;align-items:center;height:100%">
        <div style="width:4px;height:30px;border-radius:2px;background:#b9d3d9;align-self:flex-start;margin-top:8px;animation:tapfade 2.4s linear infinite;animation-delay:0s"></div>
        <div style="width:4px;height:24px;border-radius:2px;background:#b9d3d9;align-self:flex-end;margin-bottom:8px;animation:tapfade 2.4s linear infinite;animation-delay:.18s"></div>
        <div style="width:4px;height:22px;border-radius:2px;background:#b9d3d9;align-self:flex-start;margin-top:14px;animation:tapfade 2.4s linear infinite;animation-delay:.36s"></div>
        <div style="width:4px;height:17px;border-radius:2px;background:#b9d3d9;align-self:flex-end;margin-bottom:12px;animation:tapfade 2.4s linear infinite;animation-delay:.54s"></div>
        <div style="width:4px;height:15px;border-radius:2px;background:#b9d3d9;align-self:flex-start;margin-top:19px;animation:tapfade 2.4s linear infinite;animation-delay:.72s"></div>
        <div style="width:4px;height:11px;border-radius:2px;background:#b9d3d9;align-self:flex-end;margin-bottom:17px;animation:tapfade 2.4s linear infinite;animation-delay:.9s"></div>
        <div style="width:4px;height:9px;border-radius:2px;background:#b9d3d9;align-self:flex-start;margin-top:24px;animation:tapfade 2.4s linear infinite;animation-delay:1.08s"></div>
        <div style="width:4px;height:7px;border-radius:2px;background:#b9d3d9;align-self:flex-end;margin-bottom:22px;animation:tapfade 2.4s linear infinite;animation-delay:1.26s"></div>
      </div>
    </div>
    <div style="position:absolute;left:10px;top:7px;font:700 8px/1 'Space Grotesk',sans-serif;letter-spacing:.14em;color:#4d5f65">L</div>
    <div style="position:absolute;left:10px;bottom:7px;font:700 8px/1 'Space Grotesk',sans-serif;letter-spacing:.14em;color:#4d5f65">R</div>
  </div>

  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;align-items:center;width:104px">
      <div style="position:relative;width:84px;height:84px">
        <div style="position:absolute;inset:-9px;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);background:repeating-conic-gradient(from 225deg,#39474b 0 1.8deg,rgba(0,0,0,0) 1.8deg 13.5deg)"></div>
        <div style="position:absolute;inset:-9px;border-radius:50%;-webkit-mask:conic-gradient(from 225deg,#000 0 89deg,rgba(0,0,0,0) 89deg);mask:conic-gradient(from 225deg,#000 0 89deg,rgba(0,0,0,0) 89deg)"><div style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);background:repeating-conic-gradient(from 225deg,#b9d3d9 0 1.8deg,rgba(0,0,0,0) 1.8deg 13.5deg)"></div></div>
        <div style="position:absolute;inset:0;border-radius:50%;background:#0b0e10;box-shadow:0 8px 18px rgba(0,0,0,.55)">
          <div style="position:absolute;inset:8%;border-radius:50%;background:linear-gradient(180deg,#364347,#191f22);box-shadow:inset 0 1px 0 rgba(185,211,217,.25)">
            <div style="position:absolute;inset:0;transform:rotate(-46deg)"><div style="position:absolute;top:10%;left:50%;width:3px;height:26%;margin-left:-1.5px;border-radius:2px;background:#b9d3d9"></div></div>
          </div>
        </div>
      </div>
      <div style="margin-top:11px;font:700 10px/1 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#b9d3d9">Mix</div>
      <div style="margin-top:4px;font:500 10px/1 'Space Grotesk',sans-serif;color:#8ba3a9">33 %</div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;width:104px">
      <div style="position:relative;width:84px;height:84px">
        <div style="position:absolute;inset:-9px;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);background:repeating-conic-gradient(from 225deg,#39474b 0 1.8deg,rgba(0,0,0,0) 1.8deg 13.5deg)"></div>
        <div style="position:absolute;inset:-9px;border-radius:50%;-webkit-mask:conic-gradient(from 225deg,#000 0 167deg,rgba(0,0,0,0) 167deg);mask:conic-gradient(from 225deg,#000 0 167deg,rgba(0,0,0,0) 167deg)"><div style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 85%,#000 85%);background:repeating-conic-gradient(from 225deg,#b9d3d9 0 1.8deg,rgba(0,0,0,0) 1.8deg 13.5deg)"></div></div>
        <div style="position:absolute;inset:0;border-radius:50%;background:#0b0e10;box-shadow:0 8px 18px rgba(0,0,0,.55)">
          <div style="position:absolute;inset:8%;border-radius:50%;background:linear-gradient(180deg,#364347,#191f22);box-shadow:inset 0 1px 0 rgba(185,211,217,.25)">
            <div style="position:absolute;inset:0;transform:rotate(32deg)"><div style="position:absolute;top:10%;left:50%;width:3px;height:26%;margin-left:-1.5px;border-radius:2px;background:#b9d3d9"></div></div>
          </div>
        </div>
      </div>
      <div style="margin-top:11px;font:700 10px/1 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#b9d3d9">Feedback</div>
      <div style="margin-top:4px;font:500 10px/1 'Space Grotesk',sans-serif;color:#8ba3a9">62 %</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:22px;padding-top:2px;width:236px">
      <div style="display:flex;align-items:center;gap:11px">
        <div style="position:relative;width:42px;height:42px;flex:none">
          <div style="position:absolute;inset:-6px;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 82%,#000 83%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 83%,#000 83%);background:repeating-conic-gradient(from 225deg,#39474b 0 2deg,rgba(0,0,0,0) 2deg 13.5deg)"></div>
          <div style="position:absolute;inset:-6px;border-radius:50%;-webkit-mask:conic-gradient(from 225deg,#000 0 148deg,rgba(0,0,0,0) 148deg);mask:conic-gradient(from 225deg,#000 0 148deg,rgba(0,0,0,0) 148deg)"><div style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 83%,#000 83%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 82%,#000 82%);background:repeating-conic-gradient(from 225deg,#b9d3d9 0 2deg,rgba(0,0,0,0) 2deg 13.5deg)"></div></div>
          <div style="position:absolute;inset:0;border-radius:50%;background:#0b0e10;box-shadow:0 4px 10px rgba(0,0,0,.5)">
            <div style="position:absolute;inset:9%;border-radius:50%;background:linear-gradient(180deg,#364347,#191f22);box-shadow:inset 0 1px 0 rgba(185,211,217,.25)">
              <div style="position:absolute;inset:0;transform:rotate(13deg)"><div style="position:absolute;top:11%;left:50%;width:2.4px;height:27%;margin-left:-1.2px;border-radius:2px;background:#b9d3d9"></div></div>
            </div>
          </div>
        </div>
        <div style="flex:1;display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:#101416;box-shadow:inset 0 1px 4px rgba(0,0,0,.5)">
          <span style="width:34px;font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.14em;color:#8ba3a9">LEFT</span>
          <span style="flex:1;font:700 19px/1 'Space Grotesk',sans-serif;color:#b9d3d9">1/8</span>
          <span style="font:500 9.5px/1 'Space Grotesk',sans-serif;color:#6c8288">250 ms</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:11px">
        <div style="position:relative;width:42px;height:42px;flex:none">
          <div style="position:absolute;inset:-6px;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 82%,#000 83%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 83%,#000 83%);background:repeating-conic-gradient(from 225deg,#39474b 0 2deg,rgba(0,0,0,0) 2deg 13.5deg)"></div>
          <div style="position:absolute;inset:-6px;border-radius:50%;-webkit-mask:conic-gradient(from 225deg,#000 0 167deg,rgba(0,0,0,0) 167deg);mask:conic-gradient(from 225deg,#000 0 167deg,rgba(0,0,0,0) 167deg)"><div style="position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,0) 83%,#000 83%);mask:radial-gradient(closest-side,rgba(0,0,0,0) 82%,#000 82%);background:repeating-conic-gradient(from 225deg,#b9d3d9 0 2deg,rgba(0,0,0,0) 2deg 13.5deg)"></div></div>
          <div style="position:absolute;inset:0;border-radius:50%;background:#0b0e10;box-shadow:0 4px 10px rgba(0,0,0,.5)">
            <div style="position:absolute;inset:9%;border-radius:50%;background:linear-gradient(180deg,#364347,#191f22);box-shadow:inset 0 1px 0 rgba(185,211,217,.25)">
              <div style="position:absolute;inset:0;transform:rotate(32deg)"><div style="position:absolute;top:11%;left:50%;width:2.4px;height:27%;margin-left:-1.2px;border-radius:2px;background:#b9d3d9"></div></div>
            </div>
          </div>
        </div>
        <div style="flex:1;display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:#101416;box-shadow:inset 0 1px 4px rgba(0,0,0,.5)">
          <span style="width:34px;font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.14em;color:#8ba3a9">RIGHT</span>
          <span style="flex:1;font:700 19px/1 'Space Grotesk',sans-serif;color:#b9d3d9">1/8T</span>
          <span style="font:500 9.5px/1 'Space Grotesk',sans-serif;color:#6c8288">167 ms</span>
        </div>
      </div>
      <div style="display:flex;gap:7px;align-items:center">
        <div style="display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#b9d3d9">
          <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="#171d20" stroke-width="1.9"><g transform="rotate(45 10 10)"><rect x="6.6" y="2.4" width="6.8" height="10.4" rx="3.4"></rect><rect x="6.6" y="7.2" width="6.8" height="10.4" rx="3.4"></rect></g></svg>
          <span style="font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#171d20">LINKED</span>
        </div>
        <div style="padding:6px 10px;border-radius:999px;border:1px solid #2a3336;font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#8ba3a9">MS</div>
      </div>
    </div>
  </div>

  <div style="margin-top:20px;padding-top:16px;border-top:1px solid #222b2e;display:flex;align-items:center;gap:22px">
    <span style="font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.16em;color:#4d5f65">PRE-STAGE</span>
    <div style="flex:1;display:flex;align-items:center;gap:9px">
      <span style="font:700 10px/1 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#b9d3d9">TAPE</span>
      <div style="flex:1;height:5px;border-radius:3px;background:#222b2e;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:22%;border-radius:3px;background:#b9d3d9"></div><div style="position:absolute;left:22%;top:-4.5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#b9d3d9"></div></div>
      <span style="font:500 10px/1 'Space Grotesk',sans-serif;color:#6c8288">22 %</span>
    </div>
    <span style="font:700 9px/1 'Space Grotesk',sans-serif;letter-spacing:.16em;color:#4d5f65">POST-STAGE</span>
    <div style="flex:1;display:flex;align-items:center;gap:9px">
      <span style="font:700 10px/1 'Space Grotesk',sans-serif;letter-spacing:.1em;color:#b9d3d9">MOD</span>
      <div style="flex:1;height:5px;border-radius:3px;background:#222b2e;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:30%;border-radius:3px;background:#b9d3d9"></div><div style="position:absolute;left:30%;top:-4.5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#b9d3d9"></div></div>
      <span style="font:500 10px/1 'Space Grotesk',sans-serif;color:#6c8288">30 %</span>
    </div>
  </div>
</div>

</body></html>
