<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0e10;font-family:"Space Grotesk",-apple-system,sans-serif}
a{color:#7fd2d8;text-decoration:none}a:hover{color:#b9d3d9}
.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(255,255,255,.07);scroll-margin-top:16px}
.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}
.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#b9d3d9;color:#0f1315;border-radius:4px;text-decoration:none}
.dv-tname{font:600 13px/1.2 "Space Grotesk",sans-serif;color:#b9d3d9}
.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}
.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(185,211,217,.14);color:#b9d3d9;border-radius:5px;text-decoration:none}
.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 "Space Grotesk",sans-serif;color:rgba(185,211,217,.6)}
.dv-opt:target .dv-oid{background:#7fd2d8;color:#0f1315}
.dv-next{margin:22px 0 0;font:12px/1.5 "Space Grotesk",sans-serif;color:rgba(185,211,217,.5)}
</style>
</helmet>

<section class="dv-turn" id="t1">
<div class="dv-thd"><a class="dv-tid" href="#t1">1</a><span class="dv-tname">Peak Grain on the onyx face &mdash; 1c only</span></div>
<div class="dv-opts">

<div class="dv-opt" id="1c">
<div class="dv-olabel"><a class="dv-oid" href="#1c">1c</a>One plate: hairline dividers, per-section displays and lead knobs</div>
<div style="width:560px;box-sizing:border-box;background:#171d20;border:1px solid #2a3336;border-radius:20px;padding:14px;box-shadow:0 20px 44px rgba(0,0,0,.4)">
  <dc-import name="Grain Header" hint-size="100%,110px"></dc-import>
  <div style="background:#20292d;border:1px solid #161c1e;border-radius:10px;box-shadow:1px 3px 3px -1px rgba(0,0,0,.54), inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden">
    <div style="display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr">

      <section style="display:flex;flex-direction:column;gap:8px;padding:10px 10px 10px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;min-height:22px"><span style="font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#b39bd8">Grain</span><span style="flex:1"></span><div style="display:flex;align-items:center;gap:4px;flex:none"><button style="font-family:inherit;font-weight:700;font-size:8px;line-height:1;letter-spacing:.12em;padding:5px 8px;border-radius:999px;border:1px solid transparent;background:#b9d3d9;color:#171d20;cursor:pointer">SYNC</button></div></div>
        <div style="box-sizing:border-box;margin-top:4px;height:50px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;overflow:hidden"><svg width="100%" height="48" viewBox="0 0 240 48" preserveAspectRatio="none" fill="none" style="display:block"><path d="M6 42 L26 6 C 62 10 120 37 234 41" stroke="#b39bd8" stroke-width="1.6" stroke-linecap="round" vector-effect="non-scaling-stroke"></path><path d="M6 42 L26 6 C 62 10 120 37 234 41 L234 46 L6 46 Z" fill="rgba(179,155,216,.1)"></path></svg></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:4px"><dc-import name="Grain Knob" caption="Mix" accent="#b39bd8" value="0.5" size="50" hint-size="50px,90px"></dc-import><dc-import name="Grain Knob" caption="Size" accent="#b39bd8" value="0.38" hint-size="46px,86px"></dc-import></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:4px"><dc-import name="Grain Knob" caption="Destiny" accent="#b39bd8" value="0.3" hint-size="46px,86px"></dc-import><dc-import name="Grain Knob" caption="Shape" accent="#b39bd8" value="0.55" hint-size="46px,86px"></dc-import></div>
      </section>

      <div style="background:#0a0b0c"></div>

      <section style="display:flex;flex-direction:column;gap:10px;padding:12px 10px 13px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;min-height:22px"><span style="font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#e78fb3">Pitch</span><span style="flex:1"></span></div>
        <div style="box-sizing:border-box;height:50px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;overflow:hidden;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:8px 24px 9px"><div style="position:absolute;left:10px;right:10px;bottom:8px;height:1px;background:#1b2529"></div><div style="position:relative;width:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center"><div style="width:100%;height:13px;border-radius:2px;background:#e78fb3;opacity:.75"></div></div><div style="position:relative;width:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center"><div style="width:100%;height:28px;border-radius:2px;background:#e78fb3;opacity:.75"></div></div><div style="position:relative;width:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center"><div style="width:100%;height:8px;border-radius:2px;background:#e78fb3;opacity:.75"></div></div></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:8px"><dc-import name="Grain Knob" caption="Low" accent="#e78fb3" value="0.34" hint-size="46px,86px"></dc-import><dc-import name="Grain Knob" caption="Unison" accent="#e78fb3" value="0.7" hint-size="46px,86px"></dc-import></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:8px"><dc-import name="Grain Knob" caption="High" accent="#e78fb3" value="0.22" hint-size="46px,86px"></dc-import><dc-import name="Grain Knob" caption="Detune" accent="#e78fb3" value="0.5" bipolar="true" hint-size="46px,86px"></dc-import></div>
      </section>

      <div style="background:#0a0b0c"></div>

      <section style="display:flex;flex-direction:column;gap:10px;padding:12px 10px 13px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;min-height:22px"><span style="font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#dfa878">Random</span><span style="flex:1"></span></div>
        <div style="box-sizing:border-box;height:50px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;overflow:hidden;position:relative"><div style="position:absolute;left:0;right:0;top:50%;height:1px;background:#1b2529"></div><div style="position:absolute;left:9px;top:6px;font-weight:700;font-size:7px;letter-spacing:.16em;color:#4d5f65">L</div><div style="position:absolute;left:9px;bottom:5px;font-weight:700;font-size:7px;letter-spacing:.16em;color:#4d5f65">R</div><div style="position:absolute;left:8%;top:62%;width:5px;height:5px;border-radius:50%;background:#dfa878;opacity:0.35"></div><div style="position:absolute;left:16%;top:34%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.50"></div><div style="position:absolute;left:24%;top:70%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.65"></div><div style="position:absolute;left:33%;top:46%;width:5px;height:5px;border-radius:50%;background:#dfa878;opacity:0.80"></div><div style="position:absolute;left:41%;top:26%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.35"></div><div style="position:absolute;left:49%;top:58%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.50"></div><div style="position:absolute;left:57%;top:38%;width:5px;height:5px;border-radius:50%;background:#dfa878;opacity:0.65"></div><div style="position:absolute;left:64%;top:74%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.80"></div><div style="position:absolute;left:72%;top:50%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.35"></div><div style="position:absolute;left:80%;top:30%;width:5px;height:5px;border-radius:50%;background:#dfa878;opacity:0.50"></div><div style="position:absolute;left:88%;top:64%;width:3px;height:3px;border-radius:50%;background:#dfa878;opacity:0.65"></div></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:4px"><dc-import name="Grain Knob" caption="Stereo" accent="#dfa878" value="0.55" hint-size="46px,86px"></dc-import><dc-import name="Grain Knob" caption="Reverse" accent="#dfa878" value="0.18" hint-size="46px,86px"></dc-import></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:4px"><dc-import name="Grain Knob" caption="Scatter" accent="#dfa878" value="0.4" hint-size="46px,86px"></dc-import></div>
      </section>
    </div>

    <div style="height:1px;background:#0a0b0c"></div>

    <div style="display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr">
      <section style="grid-column:1 / span 3;display:flex;flex-direction:column;gap:10px;padding:12px 10px 13px;min-width:0;padding:12px 14px 14px">
        <div style="display:flex;align-items:center;gap:8px;min-height:22px"><button style="appearance:none;width:20px;height:20px;flex:none;border-radius:999px;border:1px solid rgba(163,206,122,.5);background:transparent;color:#a3ce7a;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 1.6 V7"></path><path d="M12.1 3.6 A6 6 0 1 1 3.9 3.6"></path></svg></button><span style="font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a3ce7a">Delay</span><span style="flex:1"></span><!-- Routing is JuceChoicePill: one cycling pill showing the current choice, not a
             three-way segmented group - lit for every position but the first ("Normal"). --><div style="display:flex;align-items:center;gap:7px"><button style="font-family:inherit;font-weight:700;font-size:8px;line-height:1;letter-spacing:.12em;padding:5px 8px;border-radius:999px;border:1px solid transparent;background:#b9d3d9;color:#171d20;cursor:pointer;white-space:nowrap">SYNC</button><button style="font-family:inherit;font-weight:700;font-size:8px;line-height:1;letter-spacing:.12em;padding:5px 8px;border-radius:999px;border:1px solid #2a3336;background:transparent;color:#b9d3d9;cursor:pointer;white-space:nowrap">NORMAL</button></div></div>
        <div style="display:flex;align-items:flex-start;gap:29px">
          <div style="display:flex;align-items:flex-start;gap:16px">
            <dc-import name="Grain Knob" caption="Mix" accent="#a3ce7a" value="0.45" size="52" ticks="true" sub="45 %" hint-size="75px,115px"></dc-import>
            <dc-import name="Grain Knob" caption="Feedback" accent="#a3ce7a" value="0.35" size="52" ticks="true" sub="35 %" hint-size="75px,115px"></dc-import>
          </div>
          <div style="display:flex;flex-direction:column;gap:15px;padding-top:4px;margin-left:auto">
            <div style="display:flex;align-items:center;gap:8px"><dc-import name="Grain Knob" caption="" accent="#a3ce7a" value="0.3" size="44" hint-size="44px,84px"></dc-import><div style="box-sizing:border-box;width:80px;height:34px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;display:flex;align-items:center;gap:6px;padding:0 8px"><span style="font-weight:700;font-size:8px;letter-spacing:.14em;color:#4d5f65">L</span><span style="font-weight:700;font-size:15px;line-height:1;color:#cfe2e6">1/8</span></div></div>
            <div style="display:flex;align-items:center;gap:8px"><dc-import name="Grain Knob" caption="" accent="#a3ce7a" value="0.3" size="44" hint-size="44px,84px"></dc-import><div style="box-sizing:border-box;width:80px;height:34px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;display:flex;align-items:center;gap:6px;padding:0 8px"><span style="font-weight:700;font-size:8px;letter-spacing:.14em;color:#4d5f65">R</span><span style="font-weight:700;font-size:15px;line-height:1;color:#cfe2e6">1/8</span></div></div>
          </div>
          <!-- Ghost copies of the Left/Right rows (invisible, width collapsed to 0) so
               the button's own vertical centre always matches the real Time rows exactly,
               whatever size those rows end up drawn at. Sits after the readouts now, so
               the button lands to their right rather than between the readouts and knobs. -->
          <div style="align-self:stretch;width:26px;flex:none;display:flex;flex-direction:column;gap:15px;padding-top:4px;margin-left:-4px">
            <div style="position:relative">
              <div style="visibility:hidden;width:0;overflow:hidden;display:flex;align-items:center;gap:8px"><dc-import name="Grain Knob" caption="" accent="#a3ce7a" value="0.3" size="44" hint-size="44px,84px"></dc-import></div>
              <button style="appearance:none;position:absolute;left:-51px;top:100%;margin-top:7.5px;transform:translateY(-50%);width:26px;height:26px;border-radius:6px;border:1px solid #2a3336;background:#1b2225;color:#9fb8bd;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><g stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" transform="rotate(45 10 10)"><rect x="6.6" y="2.4" width="6.8" height="10.4" rx="3.4"></rect><rect x="6.6" y="7.2" width="6.8" height="10.4" rx="3.4"></rect></g></svg></button>
            </div>
            <div style="position:relative">
              <div style="visibility:hidden;width:0;overflow:hidden;display:flex;align-items:center;gap:8px"><dc-import name="Grain Knob" caption="" accent="#a3ce7a" value="0.3" size="44" hint-size="44px,84px"></dc-import></div>
            </div>
          </div>
        </div>
      </section>

      <div style="grid-column:4;background:#0a0b0c"></div>

      <section style="grid-column:5;display:flex;flex-direction:column;gap:10px;padding:12px 10px 13px;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;min-height:22px"><button style="appearance:none;width:20px;height:20px;flex:none;border-radius:999px;border:1px solid rgba(127,210,216,.5);background:transparent;color:#7fd2d8;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 1.6 V7"></path><path d="M12.1 3.6 A6 6 0 1 1 3.9 3.6"></path></svg></button><span style="font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7fd2d8">Reverb</span><span style="flex:1"></span></div>
        <div style="box-sizing:border-box;height:50px;border-radius:5px;background:#101416;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);border:1px solid #161c1e;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:9px 12px"><div style="width:5px;height:28px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:22px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:17px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:13px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:9px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:6px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:4px;border-radius:2px;background:#7fd2d8;opacity:.7"></div><div style="width:5px;height:3px;border-radius:2px;background:#7fd2d8;opacity:.7"></div></div>
        <div style="display:flex;align-items:flex-start;justify-content:space-around;gap:4px"><dc-import name="Grain Knob" caption="Mix" accent="#7fd2d8" value="0.35" size="40" hint-size="40px,80px"></dc-import><dc-import name="Grain Knob" caption="Decay" accent="#7fd2d8" value="0.5" size="40" hint-size="40px,80px"></dc-import><dc-import name="Grain Knob" caption="Low Cut" accent="#7fd2d8" value="0.18" size="40" hint-size="40px,80px"></dc-import></div>
      </section>
    </div>

    <div style="height:1px;background:#0a0b0c"></div>
    <div style="padding:12px">
      <dc-import name="Grain Scope" hint-size="100%,66px"></dc-import>
    </div>
  </div>
</div>
</div>

</div>
</section>
</x-dc>
</body>
</html>
